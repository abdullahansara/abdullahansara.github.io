title: Abdullah Ansar
tagline: "Islamic intellectual history, Qur'anic orality and memory, philosophy and cognitive science"
description: "Academic website of Abdullah Ansar: research on Qur'anic orality and memory, early Shi'i thought and legal theory, Islamic philosophy, and the cognitive science of religion."
baseurl: ""
url: "https://abdullahansara.github.io"
lang: en

author:
  name: Abdullah Ansar

markdown: kramdown
permalink: /blog/:year/:month/:day/:title/

collections:
  publications:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, author: Abdullah Ansar }
  - scope: { path: "", type: publications }
    values: { layout: publication }

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - DEPLOYMENT.md
  - package.json
  - package-lock.json
  - tsconfig.json
  - next.config.mjs
  - next-env.d.ts
  - vercel.json
  - .env.example
  - .neon
  - src
  - scripts
  - public
  - node_modules
