kicker: "Islamic intellectual history · Philosophy · Cognitive science"
headline: Abdullah Ansar
deck: "I study how Islamic intellectual traditions are transmitted, remembered, and argued over: Qur'anic orality and memory, early Shi'i law and theology, and Islamic philosophy, using both textual-historical and computational methods."
research_intro: "Four strands organize my work."
themes:
  - title: "Qur'anic orality and memory"
    description: "Recitation, memorization, and variant readings; how oral and written transmission interact, and what the cognitive science of memory can and cannot say about verbatim recall in early Islam."
  - title: "Early Shi'i law and theology"
    description: "Imami doctrine of authority, the emergence of proto-usuli reasoning, and the transmission of early Shi'i traditions."
  - title: "Islamic philosophy"
    description: "Twelver Shi'i philosophy, graded being, the nature of the human (insan), and Islamic thought on prophecy, intellect, and artificial minds."
  - title: "Digital and computational methods"
    description: "Network and phylogenetic analysis of isnads, corpus-scale hadith databases, and quantitative approaches to Qur'anic chronology."
news:
  - date: "October 2026"
    text: "Presented \"The 'in-between' of brain, being, and faith: Metaxy, Islamic thought, and the neuroscience of liminal consciousness\" at Faith Across Fields, University of Chicago."
  - date: "2025"
    text: "\"The Law of the Imam: Realist Particularism and Proto-Usulism in Formative Shi'i Islam\" published in <em>Islamic Law and Society</em>."
  - date: "2024"
    text: "Cataloging intern at the Hill Museum &amp; Manuscript Library (HMML); published \"Enlightened by One Lamp\" in HMML Stories."
