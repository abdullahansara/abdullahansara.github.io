kicker: "Islamic intellectual history · Philosophy · Cognitive science"
headline: Abdullah Ansar
deck: "I study the formation of early Islamic intellectual history, especially Shiʿi law, theology, and esotericism, through the transmission of texts: isnad-cum-matn analysis, oral transmission and memory, and Islamic philosophy."
research_intro: "Four strands organize my work."
themes:
  - title: "Early Shiʿi hadith and historical method"
    description: "Dating and reconstructing Imāmī traditions with isnad-cum-matn analysis (ICMA); the historical Jaʿfar al-Ṣādiq; the Imām's hypomnēma as an interface between oral instruction and written transmission."
  - title: "Law, authority, and esotericism"
    description: "The Imām as legislator and proto-uṣūlī thinker; realist particularism in early Jaʿfarī jurisprudence; docetism and the image of the Imām in early Ghūlāt literature."
  - title: "Memory, orality, and the Qurʾān"
    description: "Oral transmission, memory, and cognitive architecture in early Islamic intellectual history; recitation, variant readings, and the basmala."
  - title: "Islamic philosophy and science"
    description: "Twelver Shiʿi philosophy of the human (insān), graded being, and plurality of worlds; how metaphysical commitments shape scientific inquiry and moral reasoning."
news:
  - date: "2026"
    text: "Presented \"The Docetic Doctrine and the Image of the Imām in Early Ghūlāt Literature\" at <em>Esoteric Currents and Intellectual Tensions: The Ghūlāt in Formative Shiism</em>, and \"Applying ICMA to Shiʿi Traditions: Reconstructing the Imām's Hypomnēma\" at the Annual Shīʿī Studies Conference."
  - date: "October 2026"
    text: "Presented \"The 'in-between' of brain, being, and faith: Metaxy, Islamic thought, and the neuroscience of liminal consciousness\" at Faith Across Fields, University of Chicago."
  - date: "2026"
    text: "New draft: \"The Caliphal Incursion into the House of Fāṭima: Reconstructing an Early Stratum of the Tradition\"."
  - date: "2025"
    text: "\"The Law of the Imām: Realist Particularism and Proto-Usulism in Formative Shiʿi Islam\" published in <em>Islamic Law and Society</em>."
